# review-rules-gvs.yaml — GVS 项目审查规则文档（v4.2）
# 规则按 Agent 角色组织，Prompt 引擎会将匹配的规则注入到各 Agent 的提示词中
# 本规则基于 GVS 现有代码实践 + Go 官方 Code Review Comments + Google Go Style Guide 制定
# 适用项目：gvs（Go 实时目标跟踪视频服务）
# 注意：gvs_infer（C++ 推理服务）的审查规则请参见 review-rules-gvs-infer.yaml
# v4.2：补充 MR 范围治理、构建产物、误提交拦截、基准测试有效性与交付脚本自检规则

version: "4.2"

# ============================================================
# 全局规则：所有 Agent 共享
# ============================================================
global:
  # 项目基础信息
  - "gvs/main 当前声明 Go 1.25，是实时目标跟踪视频服务，使用 gocv (OpenCV CGO绑定) 进行图像处理，运行于 Ubuntu 22.04（x86_64/aarch64）"
  - "gvs 包含大量并发代码（goroutine + channel），审查时必须关注生命周期管理和数据竞争"
  - "项目支持多厂商摄像头（hik/hope/huanyu/dahua），接口设计需考虑兼容性"
  - "必须注意 gocv Mat 等 CGO 资源的显式释放，CGO 对象不受 Go GC 管理"

  # 审查范围与原则
  - "模型对全局代码理解、变更意图和实际逻辑的推理是审查主体；本 YAML 规则仅作辅助检查清单，不得用规则命中代替代码证据"
  - "审查前必须理解本次 diff 试图改变的行为、受影响调用链和必须保持的系统不变量，再判断问题是否真实存在"
  - "检查新增或修改的注释、文档、配置说明与实际控制流、数据流、错误处理是否一致；不一致时必须引用具体 diff 证据"
  - "只审查本次 diff 中的变更代码，不要评论未变更的代码"
  - "问题必须基于 diff 中实际存在的代码，禁止臆测不存在的代码（避免幻觉）"
  - "评论使用中文，建议要具体可操作，能给出参考代码时给出"
  - "优先关注正确性、安全性、性能问题，其次才是风格问题"
  - "专业 Agent 的发现均为候选问题，必须经统筹确认 Agent 核对、合并与驳回后才能发布"
  - "MR 标题、描述与实际 diff 范围必须一致；出现长期分支累计、批量权限翻转、无关模块或大量二进制时，应先报告覆盖风险并要求拆分或重基线，禁止把部分文件审查表述为完整通过"
  - "生成物、命令输出、临时文件、可执行文件和第三方二进制不得无解释进入源码 MR；确需提交时必须说明来源、可复现构建方式、校验值和许可证"
  - "误提交的终端拷贝与命令输出文件（文件名含前导分号/空格、或本身就是命令行片段如 '; git diff --stat ...'）必须拦截：要求从 MR 移除并检查 .gitignore，不得视为有效变更放行"
  - "涉及 gvs_infer 的 protobuf、模型名、配置键、权重路径、TensorRT 版本或错误语义时，必须与 gvs_infer 同步核对，不能仅验证单仓库能编译"

  # Go 语言通用规范（基于 go.dev/wiki/CodeReviewComments + open-code-review go.md 精华）
  - "代码必须通过 gofmt / goimports 格式化，import 分组：标准库 > 第三方 > 项目内部"
  - "错误处理：禁止裸 _ 忽略错误；优先使用 if err != nil { return } 模式保持正常路径缩进最少"
  - "错误字符串小写开头、无结尾标点，便于拼接上下文"
  - "不要 panic，除非在 init/main 中遇到不可恢复错误；库代码必须返回 error"
  - "Context 作为函数第一个参数传递，禁止在 struct 中存储 Context"
  - "导出的类型/函数必须有文档注释，注释以被描述对象名称开头，以句号结尾"
  - "包名应简洁有意义，避免 util、common、misc 等无意义包名"
  - "首字母缩略词统一大小写：URL、ID、HTTP，不要混写如 Url、Id、Http"
  - "Receiver Type：含 sync.Mutex 的 struct 必须用指针 receiver；不要混用值和指针 receiver"
  - "变量名应简短：局部变量用短名（i, c），全局变量和远处使用的变量用描述性名称"
  - "错误包装：需要保留错误身份时用 %w（支持 errors.Is/errors.As），不要用 %v 丢失原始原因"
  - "禁止在 defer 中覆盖主错误：defer cleanup() 不应丢弃 Close/Commit/Rollback 的错误"
  - "sync.Once 不用于需要失败后重试的场景：Once.Do 即使 panic 也视为完成，不会重试"

# ============================================================
# 按 Agent 角色的专项规则
# ============================================================
agents:
  # -------------------- architect（架构师） --------------------
  architect:
    - "检查模块划分是否合理，接口设计是否清晰（输入输出、错误返回）"
    - "检查依赖关系是否清晰，是否存在循环依赖"
    - "检查 cam、stream、track 等核心模块的接口一致性"
    - "检查 gvflow 数据流图节点的设计合理性"
    - "检查 statemachine 状态转换是否完备"
    - "接口定义应放在消费者侧（使用方），而非实现方；实现方返回具体类型"
    - "新增模块是否遵循单一职责原则，避免 God Object"
    - "检查跨平台代码（single_*.go、build tag）的兼容性设计"
    - "检查配置结构体是否过度嵌套，是否可通过 functional options 模式简化"

  # -------------------- security（安全） --------------------
  security:
    - "检查敏感信息泄露（硬编码密码、API Key、Token）"
    - "检查命令注入（尤其 ffmpeg 命令拼接）、SQL 注入"
    - "检查 gvhttp 路由的输入校验是否完备"
    - "检查 mqttc MQTT 连接和 onvifcam 摄像头认证的安全性"
    - "检查越界访问和不安全的反序列化"
    - "HTTP handler 必须能安全并发调用，避免共享可变状态导致的数据竞争"
    - "禁止在日志中打印敏感信息（密码、Token、完整请求体含凭据）"
    - "检查文件路径拼接是否使用 path/filepath 而非字符串拼接，防止目录遍历"
    - "检查 grpc 通信是否使用安全凭证（生产环境禁止 insecure.NewCredentials）"
    - "检查 math/rand 是否用于安全敏感场景（密钥、Token、会话ID），必须用 crypto/rand"
    - "检查 reflect/unsafe/cgo 的使用是否有明确文档说明和边界检查"
    - "检查序列化数据（JSON/protobuf）是否来自不可信输入，防止反序列化攻击"

  # -------------------- performance（性能） --------------------
  performance:
    - "检查 goroutine 泄漏（未监听 ctx.Done、channel 阻塞）"
    - "检查 gocv Mat 等 cgo 资源是否正确 Close/释放"
    - "检查 gvpool 对象池使用是否合理，避免频繁内存分配"
    - "检查锁竞争和死锁风险"
    - "检查视频流实时处理路径上的大对象拷贝"
    - "检查是否在热路径上进行了不必要的内存分配（如循环内重复创建对象）"
    - "检查 channel 容量是否合理：无缓冲 channel 会阻塞 sender，确认是否故意设计"
    - "检查 sync.RWMutex 是否滥用：保护简单变量或短操作时用 sync.Mutex 更高效"
    - "检查 time.Ticker 是否使用 defer tick.Stop() 防止泄漏"
    - "检查是否可以通过对象复用（sync.Pool / gvpool）减少 GC 压力"
    - "grpc 调用是否设置了合理的 MaxCallRecvMsgSize / MaxCallSendMsgSize 防止 OOM"
    - "检查 defer 是否在循环内导致资源延迟释放（大循环/无限循环中避免 defer）"
    - "检查 slice append 是否导致底层数组逃逸：向共享 backing storage append 可能引发数据竞争"
    - "检查整数运算溢出：类型转换、narrowing、有符号/无符号比较、size 计算在边界输入下是否安全"

  # -------------------- standard（开发规范） --------------------
  standard:
    - "检查命名规范（包名小写、驼峰命名、错误变量 err 开头）"
    - "检查错误处理是否遗漏（if err != nil 模式，禁止裸 _ 忽略错误）"
    - "检查注释和文档是否与代码一致"
    - "检查跨平台代码（single_*.go、build tag）的兼容性"
    - "检查是否使用裸返回（naked return），超过 3 行的函数必须显式返回"
    - "检查函数参数数量，超过 4-5 个时考虑封装为结构体"
    - "检查是否遵循 'Indent Error Flow'：正常代码保持最少缩进，错误处理提前 return"
    - "检查空 slice 声明：优先用 var s []T 而非 s := []T{}（除非需要 JSON 编码区分 null/[]）"
    - "检查是否混用值 receiver 和指针 receiver，同一类型的方法应统一"
    - "检查导入是否使用了 import . 或 import _ 的副作用导入，避免不必要的使用"
    - "理解开发意图，检查是否精准改动，避免过量更改了不必要的内容，避免无意义的代码变动"
    - "检查 nil interface 陷阱：typed nil 指针存入非 nil interface 后可能被误判为存在"
    - "检查 copy 语义：含 sync.Mutex/RWMutex/Once/Pool/atomic 的 struct 禁止值拷贝（value receiver、append、map value、return 等）"

  # -------------------- test（测试） --------------------
  test:
    - "检查新增/变更的导出函数是否有对应测试"
    - "检查边界条件测试（空输入、超大输入、并发）"
    - "检查并发代码是否有 race condition 风险"
    - "检查 integration_test 是否与单元测试解耦"
    - "测试失败信息必须有帮助：包含输入、实际输出、期望输出（t.Errorf(\"Foo(%q) = %d; want %d\", in, got, want)）"
    - "优先使用 table-driven tests 减少重复代码"
    - "并发代码测试必须开启 -race 检测"
    - "检查测试是否依赖外部服务或环境，单元测试应可独立运行"
    - "Mock 应基于接口实现，不要为测试而修改生产代码结构"
    - "检查不要有测试代码，临时代码混入生产代码"
    - "测试应关注具体的正确性、并发、错误、边界失败模式，避免无意义的格式化/风格测试"
    - "优先确定性测试，避免依赖时序的脆弱并发测试"
    - "qatool 基准测试（--bench）的延迟结论只有在输入尺寸、warmup、样本数、同步边界、统计量与 gvs_infer --test-model 口径一致时才可与推理侧对比；口径不一致时结论必须标注不可比，禁止直接下性能结论"

  # -------------------- ai（AI算法） --------------------
  ai:
    - "检查 dnn 模块的模型加载和释放是否配对"
    - "检查图像预处理（归一化、尺寸调整）是否正确"
    - "检查模型推理结果的置信度过滤策略"
    - "检查 trajectory 轨迹预测和 grdetect 检测算法的逻辑"
    - "检查 AI 推理是否异步处理，避免阻塞主流程"
    - "检查模型版本管理和热更新机制"
    - "检查批量推理 vs 单条推理的选择是否合理"
    - "检查推理结果的后处理（NMS、置信度阈值）是否一致"

  # -------------------- ui（接口/UI） --------------------
  ui:
    - "检查 gvhttp API 响应结构是否统一（统一包装格式）"
    - "检查 HTTP 接口错误码设计是否规范"
    - "检查配置文件结构是否清晰，日志输出是否便于排查"
    - "检查状态机状态定义是否语义清晰"
    - "检查 gin handler 中是否正确处理了参数绑定和校验错误"
    - "检查 HTTP 响应是否设置了正确的 Content-Type 和状态码"
    - "检查 API 路由设计是否遵循 RESTful 规范"

  # -------------------- ai_tool（AI工具） --------------------
  ai_tool:
    - "检查 AI 相关代码的 Prompt 工程是否合理"
    - "检查模型调用方式是否最优（批量推理 vs 单条推理）"
    - "检查 AI 推理是否异步处理，避免阻塞主流程"
    - "检查模型版本管理和热更新机制"
    - "在合适场景给出使用 AI 能力的建议"

  # -------------------- concurrency（并发） --------------------
  concurrency:
    - "检查 goroutine 生命周期是否清晰：何时退出、是否会泄漏"
    - "检查共享变量访问是否受同步机制保护（mutex、atomic、channel）"
    - "检查 loop variable 是否正确传入 goroutine（避免闭包捕获循环变量）"
    - "检查 sync.Map 的并发使用：Load+Store 组合是否有竞态，应使用 LoadOrStore"
    - "检查 channel 关闭后是否还有发送操作（向关闭的 channel 发送会 panic）"
    - "检查 select 中是否处理了所有 channel 情况，避免永久阻塞"
    - "检查 WaitGroup 使用：Add 必须在 goroutine 启动前调用，Done 必须确保执行"
    - "检查 atomic 操作的对齐要求（64 位值在 32 位系统上需要对齐）"
    - "检查 context 传递：取消信号是否逐级传递，超时设置是否合理"
    - "检查 mutex 是否跨阻塞 I/O 持有：锁内不应进行网络/数据库调用或长耗时操作"
    - "检查 RLock 期间是否发生写操作：RLock 保护的数据在持有期间禁止修改"
    - "检查多个 channel closer 问题：明确唯一的关闭责任方，防止 send-on-closed 和 double-close"
    - "检查 select default 是否导致忙等或丢弃必要工作"
    - "检查 loop variable 捕获：Go 1.22+ range 语义改变，老模块可能仍共享循环变量"

  # -------------------- resource（资源） --------------------
  resource:
    - "检查 gocv.Mat / gvcv.Mat 是否有对应的 Close() 调用，推荐 defer mat.Close()"
    - "检查 grpc.ClientConn 是否在不再需要时 Close"
    - "检查文件句柄、网络连接是否及时关闭"
    - "检查临时文件是否清理，避免磁盘空间泄漏"
    - "检查 gvpool.MatPool.Put() 是否在资源使用完毕后调用"
    - "检查 http.Response.Body、sql.Rows、压缩 reader/writer 等可关闭资源是否在所有可达路径上关闭"
    - "检查 sql.Rows 迭代后是否检查 rows.Err()，提前终止时是否关闭 rows"
    - "检查事务（Begin）后是否有对应的 Commit/Rollback，所有返回路径都要处理"
    - "检查 time.Ticker/time.Timer 是否在使用完毕后 Stop，避免资源泄漏"

  # -------------------- dataflow（数据流） --------------------
  dataflow:
    - "检查 gvflow 节点间的数据类型是否匹配（Build 时会做类型检查，但运行时仍需关注）"
    - "检查 flow graph 的 Kill/Stop/Wait 调用顺序是否正确，避免 goroutine 泄漏"
    - "检查数据在节点间的所有权转移是否清晰，避免重复释放或泄漏"
    - "检查 channel buffer 大小是否合理，避免内存暴涨或频繁阻塞"

# ============================================================
# 路径级规则：diff 中包含匹配路径时追加对应规则
# ============================================================
paths:
  - pattern: "gvhttp/**"
    rules:
      - "HTTP handler 必须校验所有外部输入参数"
      - "响应必须使用统一的 Response 包装结构"
      - "gin 路由 handler 禁止在请求处理中启动无限制 goroutine"
      - "上传接口必须限制文件大小和类型"

  - pattern: "dnn/**"
    rules:
      - "模型推理输入必须做归一化和尺寸校验"
      - "gocv Mat 必须 defer Close"
      - "模型加载失败时必须有降级策略或明确错误返回"

  - pattern: "stream/**"
    rules:
      - "流处理 goroutine 必须监听 context 取消信号"
      - "视频帧处理路径上避免不必要的图像拷贝"
      - "检查帧率控制逻辑，避免 CPU 空转或过度占用"

  - pattern: "cam/**"
    rules:
      - "摄像头 SDK 调用必须处理超时和断连重试"
      - "检查摄像头登录凭据是否通过安全方式传递，禁止硬编码"
      - "PTZ 控制命令必须做范围校验，防止非法值"

  - pattern: "gvflow/**"
    rules:
      - "flow graph 节点函数签名必须符合要求：sync 函数最后返回 error，async 函数签名匹配 CallableAsync"
      - "节点间传递的指针数据所有权必须清晰"
      - "Build 后必须调用 Go() 启动，结束前必须调用 Kill() + Wait()"

  - pattern: "gvpool/**"
    rules:
      - "MatPool.Get() 获取的 Mat 必须配对 Put() 或 Close()"
      - "检查 pool 配置（MaxSize/MinSize）是否合理，避免内存过度占用"

  - pattern: "communication/**"
    rules:
      - "grpc 连接必须设置超时和重试策略"
      - "protobuf 消息字段必须检查 nil 指针访问"
      - "grpc 流式调用必须正确处理 io.EOF 和取消信号"

  - pattern: "datastorage/**"
    rules:
      - "文件写入操作必须处理磁盘满的情况"
      - "检查并发写入同一文件是否有同步机制"
      - "临时文件写入后必须及时清理或归档"

  - pattern: "track/**"
    rules:
      - "跟踪器状态转换必须完备，禁止非法状态跳转"
      - "目标丢失后的处理逻辑必须明确（重试/切换模式/停止）"

  - pattern: "grdetect/**"
    rules:
      - "检测流程中的 goroutine 和 channel 必须有明确的退出机制"
      - "检测结果的后处理（过滤、合并）逻辑必须一致"
      - "多摄像头协同逻辑必须处理时序和同步问题"

  - pattern: "gvscheduler/**"
    rules:
      - "调度器任务过期策略必须明确，避免内存无限增长"
      - "并发访问调度队列必须有互斥保护"

  - pattern: "config/**"
    rules:
      - "配置项必须有合理的默认值"
      - "敏感配置（密码、密钥）禁止以明文形式存储或打印"
      - "配置变更后是否需要热加载，热加载是否线程安全"

  - pattern: "qatool/**"
    rules:
      - "setup_lib.sh 等交付脚本必须检查 readelf/ldd 本身的退出状态：解析失败时不得输出自检成功"
      - "共享库自检必须递归解析 .so 的传递依赖闭包（NEEDED 链），缺失任一依赖都必须报错并以非零退出码失败"
      - "qatool 引用的动态库必须与目标部署环境（x86_64/aarch64）架构一致，禁止用本机库替代目标库做自检"
      - "新增的交付检查项必须定义明确的失败退出码；静默通过视为缺陷"
